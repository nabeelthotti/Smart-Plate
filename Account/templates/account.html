<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartPlate - Account</title>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <!-- Optionally include Font Awesome if needed for the icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f5f7;
    }
    /* Sidebar Styles (DO NOT MODIFY) */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      width: 60px;
      background-color: #253858;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
      transition: width 0.3s ease, opacity 0.3s ease;
      z-index: 1000;
      overflow: hidden;
    }
    .sidebar.extended {
      width: 250px;
      align-items: flex-start;
    }
    .sidebar .menu-item {
      width: 100%;
      padding: 10px 15px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #dfe1e6;
      text-decoration: none;
      border-radius: 5px;
      transition: background-color 0.3s, opacity 0.3s ease;
      cursor: pointer;
      opacity: 0;
    }
    .sidebar.extended .menu-item {
      opacity: 1;
    }
    .sidebar .menu-item:hover {
      background-color: #344563;
    }
    .sidebar .menu-item.active {
      background-color: #0052cc;
    }
    .sidebar .menu-item span {
      display: none;
    }
    .sidebar.extended .menu-item span {
      display: inline;
    }
    .sidebar .logo {
      width: 100%;
      text-align: center;
      margin-bottom: 20px;
    }
    .sidebar .logo img {
      width: 40px;
    }
    .sidebar.extended .logo {
      text-align: left;
      padding: 0 15px;
    }
    .sidebar.extended .logo h1 {
      display: inline;
      margin-left: 10px;
      color: white;
      font-size: 18px;
    }
    .sidebar .add-widgets {
      margin-top: 20px;
      color: white;
      cursor: pointer;
      padding: 10px 15px;
      background-color: #344563;
      text-align: center;
      border-radius: 5px;
      opacity: 0;
    }
    .sidebar.extended .add-widgets {
      opacity: 1;
    }
    /* Main Content */
    .main {
      margin-left: 60px;
      padding: 20px;
      transition: margin-left 0.3s ease;
    }
    .main.shifted {
      margin-left: 250px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    header h1 {
      margin: 0;
      color: #172b4d;
    }
    .top-buttons {
      display: flex;
      gap: 15px;
    }
    .top-buttons button {
      background-color: #0052cc;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .top-buttons button:hover {
      background-color: #003d99;
    }
    /* Account Settings Card */
    .account-container {
      background-color: white;
      padding: 20px;
      margin: auto;
      max-width: 600px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
      border-radius: 10px;
    }
    .account-container h2 {
      margin-top: 0;
      margin-bottom: 20px;
    }
    /* Updated Profile Field Styles for Display Mode */
    .profile-field {
      display: flex;
      flex-direction: column;
      gap: 8px; /* Uniform space between label and content */
      padding: 8px 0;
      border-bottom: 1px solid #ddd;
      margin-bottom: 15px;
    }
    .profile-field label {
      font-weight: bold;
      color: #000;
    }
    .profile-field span,
    .profile-field div {
      color: #000;
    }
    /* Ensure address content has extra space */
    #displayAddress {
      margin-top: 8px;
    }
    /* We now use only one group for the address display */
    #addressDisplayGroup,
    #displayAddressGroup {
      display: none;
    }
    /* Edit Mode Fields */
    .edit-field {
      margin-bottom: 15px;
    }
    .edit-field label {
      display: block;
      margin-bottom: 10px; /* Increased spacing for edit fields */
      font-weight: bold;
      font-size: 14px;
      color: #000;
    }
    .sidebar.extended .add-widgets {
      opacity: 1; 
      margin-left: auto;
      margin-right: auto;
    }
    .edit-field input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }
    /* Group the address edit fields together */
    .address-fields {
      margin-top: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 10px;
      background-color: #fafafa;
    }
    .address-fields label {
      margin-top: 5px;
    }
    /* Shared Button Style */
    .account-container button,
    .modal-content button {
      background-color: #0052cc;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
      margin-top: 10px;
    }
    .account-container button:hover,
    .modal-content button:hover {
      background-color: #003d99;
    }
    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    /* Modal Styles for Change Password */
    .modal {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0, 0, 0, 0.5);
    }
    .modal-content {
      background-color: #fefefe;
      margin: 10% auto;
      padding: 20px;
      border-radius: 10px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      position: relative;
      font-size: 14px;
    }
    .modal-content .close {
      color: #aaa;
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }
    .modal-content .close:hover,
    .modal-content .close:focus {
      color: black;
    }
    .modal-content label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 14px;
      color: #000;
    }
    .modal-content input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <!-- Sidebar (DO NOT MODIFY) -->
  <div class="sidebar" id="sidebar">
    <div class="logo">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="SmartPlate Logo">
    </div>
    <div class="menu-item" onclick="window.location.href='/dashboard'">
      <i class="fas fa-tachometer-alt"></i>
      <span>Dashboard</span>
    </div>
    <div class="menu-item active" onclick="window.location.href='/account'">
      <i class="fas fa-user"></i>
      <span>Account</span>
    </div>
    <div class="menu-item" onclick="window.location.href='/analytics'">
      <i class="fas fa-chart-line"></i>
      <span>Analytics</span>
    </div>
    <div class="menu-item" onclick="window.location.href='/settings'">
      <i class="fas fa-cog"></i>
      <span>Settings</span>
    </div>
    <div class="add-widgets" id="addWidgets">Add Widgets</div>
  </div>

  <!-- Main Content -->
  <div class="main" id="mainContent">
    <header>
      <button class="menu-button" id="menuButton">☰</button>
      <h1>Account Settings</h1>
      <div class="top-buttons">
        <!-- Additional header buttons if needed -->
      </div>
    </header>

    <div class="account-container">
      <h2>User Information</h2>
      <!-- Display Mode -->
      <div id="profileDisplay">
        <div class="profile-field">
          <label>Full Name:</label>
          <span id="displayName"></span>
        </div>
        <div class="profile-field">
          <label>Username:</label>
          <span id="displayUsername"></span>
        </div>
        <div class="profile-field">
          <label>Email:</label>
          <span id="displayEmail"></span>
        </div>
        <div class="profile-field">
          <label>Phone:</label>
          <span id="displayPhone"></span>
        </div>
        <!-- Combined Address Display -->
        <div class="profile-field" id="displayAddressGroup">
          <label>Address:</label>
          <!-- Using a div ensures the address content starts on a new line with a margin -->
          <div id="displayAddress"></div>
        </div>
        <button id="editButton">Modify</button>
        <button id="changePasswordButton">Change Password</button>
      </div>
      <!-- Edit Mode (always shows detailed address fields) -->
      <div id="profileEdit" style="display: none;">
        <div class="edit-field">
          <label for="editName">Full Name:</label>
          <input type="text" id="editName">
        </div>
        <div class="edit-field">
          <label for="editUsername">Username:</label>
          <input type="text" id="editUsername">
        </div>
        <div class="edit-field">
          <label for="editEmail">Email:</label>
          <input type="email" id="editEmail">
        </div>
        <div class="edit-field">
          <label for="editPhone">Phone:</label>
          <input type="text" id="editPhone">
        </div>
        <!-- Address fields always visible in edit mode -->
        <div class="edit-field address-fields">
          <label>Address:</label>
          <input type="text" id="editStreet" placeholder="Street">
          <input type="text" id="editCity" placeholder="City">
          <input type="text" id="editState" placeholder="State">
          <input type="text" id="editZip" placeholder="Zip Code">
        </div>
        <div class="button-group">
          <button id="saveProfileButton">Save</button>
          <button id="cancelEditButton">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal for Change Password -->
  <div id="passwordModal" class="modal">
    <div class="modal-content">
      <span class="close" id="closePasswordModal">&times;</span>
      <h2>Change Password</h2>
      <label for="currentPassword">Current Password:</label>
      <input type="password" id="currentPassword">
      <label for="newPassword">New Password:</label>
      <input type="password" id="newPassword">
      <label for="confirmNewPassword">Confirm New Password:</label>
      <input type="password" id="confirmNewPassword">
      <div class="button-group">
        <button id="savePasswordButton">Save</button>
        <button id="cancelPasswordButton">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    // Sidebar toggle functionality (DO NOT MODIFY)
    const sidebar = document.getElementById('sidebar');
    const menuButton = document.getElementById('menuButton');
    const mainContent = document.getElementById('mainContent');
    menuButton.addEventListener('click', () => {
      sidebar.classList.toggle('extended');
      mainContent.classList.toggle('shifted');
    });
    document.getElementById('addWidgets').addEventListener('click', () => {
      alert('Widget adding functionality coming soon!');
    });

    // Fetch user profile and populate display and edit fields
    async function fetchUserProfile() {
      try {
        const response = await axios.get('/account-api/user-profile');
        if (response.data.status === 'success') {
          const user = response.data.user;
          // Populate display fields
          document.getElementById('displayName').textContent = user.name || '';
          document.getElementById('displayUsername').textContent = user.username || '';
          document.getElementById('displayEmail').textContent = user.email || '';
          document.getElementById('displayPhone').textContent = user.phone || '';
          // Display address in two lines:
          // First line: ROAD
          // Second line: CITY, STATE, ZIP CODE
          if (user.address) {
            let addressStr = '';
            if (typeof user.address === 'object') {
              addressStr = `${user.address.street || ''}<br>${user.address.city || ''}, ${user.address.state || ''} ${user.address.zip || ''}`;
            } else {
              addressStr = user.address;
            }
            document.getElementById('displayAddress').innerHTML = addressStr;
            document.getElementById('displayAddressGroup').style.display = 'block';
          }
          // Populate edit fields
          document.getElementById('editName').value = user.name || '';
          document.getElementById('editUsername').value = user.username || '';
          document.getElementById('editEmail').value = user.email || '';
          document.getElementById('editPhone').value = user.phone || '';
          if (user.address && typeof user.address === 'object') {
            document.getElementById('editStreet').value = user.address.street || '';
            document.getElementById('editCity').value = user.address.city || '';
            document.getElementById('editState').value = user.address.state || '';
            document.getElementById('editZip').value = user.address.zip || '';
          } else {
            document.getElementById('editStreet').value = user.address || '';
            document.getElementById('editCity').value = '';
            document.getElementById('editState').value = '';
            document.getElementById('editZip').value = '';
          }
        } else {
          alert('Error: ' + response.data.message);
        }
      } catch (error) {
        alert('Failed to fetch user profile.');
      }
    }

    // Toggle to edit mode for profile updates
    document.getElementById('editButton').addEventListener('click', () => {
      document.getElementById('profileDisplay').style.display = 'none';
      document.getElementById('profileEdit').style.display = 'block';
    });
    // Cancel editing and return to display mode
    document.getElementById('cancelEditButton').addEventListener('click', () => {
      document.getElementById('profileEdit').style.display = 'none';
      document.getElementById('profileDisplay').style.display = 'block';
    });
    // Save profile updates
    document.getElementById('saveProfileButton').addEventListener('click', async () => {
      const name = document.getElementById('editName').value;
      const username = document.getElementById('editUsername').value;
      const email = document.getElementById('editEmail').value;
      const phone = document.getElementById('editPhone').value;
      const updateData = { name, username, email, phone };
      
      // Gather address from the detailed fields
      const address = {
        street: document.getElementById('editStreet').value,
        city: document.getElementById('editCity').value,
        state: document.getElementById('editState').value,
        zip: document.getElementById('editZip').value
      };
      updateData.address = address;
      
      try {
        const response = await axios.put('/account-api/update-profile', updateData);
        if (response.data.status === 'success') {
          alert(response.data.message);
          // Update display fields
          document.getElementById('displayName').textContent = name;
          document.getElementById('displayUsername').textContent = username;
          document.getElementById('displayEmail').textContent = email;
          document.getElementById('displayPhone').textContent = phone;
          const addressStr = `${address.street}<br>${address.city}, ${address.state} ${address.zip}`;
          document.getElementById('displayAddress').innerHTML = addressStr;
          // Show combined address display
          document.getElementById('displayAddressGroup').style.display = 'block';
          // Switch back to display mode
          document.getElementById('profileEdit').style.display = 'none';
          document.getElementById('profileDisplay').style.display = 'block';
        } else {
          alert('Error: ' + response.data.message);
        }
      } catch (error) {
        alert('Failed to update profile.');
      }
    });

    // Change Password Modal functionality
    document.getElementById('changePasswordButton').addEventListener('click', () => {
      document.getElementById('passwordModal').style.display = 'block';
    });
    document.getElementById('closePasswordModal').addEventListener('click', hidePasswordModal);
    document.getElementById('cancelPasswordButton').addEventListener('click', hidePasswordModal);
    window.addEventListener('click', (event) => {
      const modal = document.getElementById('passwordModal');
      if (event.target === modal) {
        hidePasswordModal();
      }
    });
    function hidePasswordModal() {
      document.getElementById('passwordModal').style.display = 'none';
      // Clear the modal inputs
      document.getElementById('currentPassword').value = '';
      document.getElementById('newPassword').value = '';
      document.getElementById('confirmNewPassword').value = '';
    }
    // Save new password
    document.getElementById('savePasswordButton').addEventListener('click', async () => {
      const currentPassword = document.getElementById('currentPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmNewPassword = document.getElementById('confirmNewPassword').value;
      if (newPassword !== confirmNewPassword) {
        alert("New passwords do not match.");
        return;
      }
      try {
        const response = await axios.put('/account-api/change-password', { currentPassword, newPassword });
        alert(response.data.message);
        hidePasswordModal();
      } catch (error) {
        alert('Failed to change password.');
      }
    });

    // Initial load of profile data
    fetchUserProfile();
  </script>
</body>
</html>
